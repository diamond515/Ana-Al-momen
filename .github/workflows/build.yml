name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          if [ -f ana-almumin.zip ]; then unzip -q -o ana-almumin.zip -d unpacked; fi
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found"
            ls -R | head -60
            exit 1
          fi
          cd "$(dirname "$f")"
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          grep -E '^e: ' /tmp/build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | while read -r line; do echo "::error::$line"; done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: ana-almumin-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
