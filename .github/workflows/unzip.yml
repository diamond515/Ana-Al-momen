name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ana-almumin.zip -d tmp
          rsync -a --exclude='.github' tmp/ana-almumin/ ./
          rm -rf tmp ana-almumin.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Extract project"
          git push
